<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">比特币四年周期轮动图</title>
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <link rel="preload" href="./fonts/reeji-flash.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* 迁移提示：固定在视口顶部，不参与 .page 的缩放测量 */
      .moved-notice {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: block;
        padding: 4px 12px;
        font-size: 12px;
        line-height: 16px;
        text-align: center;
        text-decoration: none;
        color: #5a4a00;
        background: #fff3b0;
        border-bottom: 1px solid #e6d36a;
      }
      .moved-notice:hover { background: #ffe97a; }
      .moved-notice b { text-decoration: underline; }
    </style>
  </head>
  <body>
    <a id="moved-notice" class="moved-notice" href="https://wolfyxbt.github.io/bitcoin-monthly-calendar/">本项目已更名为「比特币月历」，此页面不再维护。<b>点击前往新地址 →</b></a>
    <main class="page">
      <header class="topbar">
        <h1 id="main-title">比特币 <span class="muted">四年周期轮动图</span></h1>
        <div class="price-box">
          <div class="price-group">
            <span class="group-label" id="price-label">比特币现价</span>
            <span id="spot-price" class="price-value">00,000</span>
          </div>
          <div class="price-group">
            <span class="group-label" id="month-label">本月</span>
            <span id="month-change" class="month-change">0.00%</span>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="table-wrap">
          <table id="cycle-table" class="cycle-table"></table>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js?v=20261003b"></script>
  </body>
</html>
